<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Pieces both templates share: the head (search and sharing details), the language link and small icons. -->

<head th:fragment="head(stylesheet, fonts)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${page.seo.title}">Venue</title>
  <meta name="description" th:content="${page.seo.description}">
  <link rel="canonical" th:href="${page.seo.canonical}">
  <th:block th:if="${page.seo.english}">
    <link rel="alternate" hreflang="en" th:href="${page.seo.english}">
    <link rel="alternate" hreflang="ne" th:href="${page.seo.nepali}">
    <link rel="alternate" hreflang="x-default" th:href="${page.seo.english}">
  </th:block>
  <meta th:if="${page.seo.noindex}" name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" th:content="${page.venue.name}">
  <meta property="og:description" th:content="${page.seo.description}">
  <meta property="og:url" th:content="${page.seo.canonical}">
  <meta property="og:locale" th:content="${page.lang == 'ne' ? 'ne_NP' : 'en_US'}">
  <meta th:if="${page.seo.image}" property="og:image" th:content="${page.seo.image}">
  <meta name="twitter:card" th:content="${page.seo.image != null ? 'summary_large_image' : 'summary'}">
  <meta name="theme-color" th:content="${page.accent}">
  <link rel="icon" href="/site-assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/site-assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/site-assets/apple-touch-icon.png">
  <th:block th:if="${fonts != null}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="${fonts}">
  </th:block>
  <link rel="stylesheet" th:href="@{'/site-assets/' + ${stylesheet} + '.css'(v=3)}">
  <!-- Validated #rrggbb values, so safe to write as they are -->
  <style th:inline="css">:root { --accent: [(${page.accent})]; --accent-ink: [(${page.accentInk})]; --accent-text: [(${page.accentText})]; }</style>
  <script type="application/ld+json" th:utext="${page.seo.jsonLd}"></script>
</head>

<body>
  <!-- Icons: 24px grid, 2px strokes, aria-hidden; the text beside them carries the meaning -->
  <svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" th:switch="${name}">
    <path th:case="'phone'" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z" />
    <path th:case="'chat'" d="M7.9 20A9 9 0 1 0 4 16.1L2 22z" />
    <g th:case="'pin'"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></g>
    <g th:case="'clock'"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></g>
    <path th:case="'arrow'" d="M5 12h14M13 6l6 6-6 6" />
    <g th:case="'trophy'"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1 1.2 1.1.5 2 2 2 3.8M18 2H6v7a6 6 0 0 0 12 0z" /></g>
  </svg>

  <!-- The page in the other language, named in that language -->
  <!-- On a demo: this isn't the venue's own website, and nothing here is a real booking -->
  <p th:fragment="demo" th:if="${demo}" class="demo-note" th:text="#{site.demo}"
    style="margin:0;padding:8px 16px;background:#14231a;color:#f8faf6;font-size:14px;line-height:1.4;text-align:center">
    A FutSlot demo, not this venue's own website.</p>

  <a th:fragment="language" class="lang-switch" th:href="${page.switchHref}" th:hreflang="${page.lang == 'ne' ? 'en' : 'ne'}"
    th:lang="${page.lang == 'ne' ? 'en' : 'ne'}" th:title="#{lang.switchTitle}" th:text="#{lang.switch}">नेपाली</a>

  <!-- Five stars, filled up to the rating -->
  <span th:fragment="stars(filled, label)" class="stars" role="img" th:attr="aria-label=${label}">
    <svg th:each="n : ${#numbers.sequence(1, 5)}" viewBox="0 0 24 24" aria-hidden="true" th:classappend="${n <= filled} ? 'on' : 'off'">
      <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" />
    </svg>
  </span>
</body>
</html>
