# What FutSlot tells players outside a page, in English: notifications, texts, and names the server gives things.
# notices_ne.properties has the same keys in Nepali. Notifications to venue owners, staff and admins aren't here:
# they stay in English, like the dashboard. As in sites.properties, messages that take values ({0}, {1}...) write an
# apostrophe twice (''), others once; values arrive already formatted.

# Booking notifications. A slot is the court and when: "Court A, Fri 9 Oct, 18:00"
booking.slot={0}, {1}
booking.moved.title=Your booking was moved
booking.moved.body={0} moved your booking to {1}.
booking.expired.title=Booking hold expired
booking.expired.body=Payment wasn''t completed in time, so your hold on {0}, {1} was released.
# Amount, by when, venue, slot
booking.paymentDue.title=Complete your payment
booking.paymentDue.body=Pay {0} by {1} to confirm {2}, {3}.
booking.confirmed.title=Booking confirmed
booking.confirmed.body={0}, {1}. Ref {2}.
booking.byVenue.title={0} booked a slot for you
booking.byVenue.body={0}. Ref {1}.
booking.cancelled.title={0} cancelled your booking
booking.cancelled.body={0}.
booking.cancelled.bodyWithReason={0}. Reason: {1}
# Venue, court, time, reference
booking.reminder.title=Your game starts soon
booking.reminder.body={0}, {1} at {2}. Ref {3}.

