spring.application.name=futslot-api

# Database (defaults match docker-compose.yml at the repo root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/futslot}
spring.datasource.username=${DB_USERNAME:futslot}
spring.datasource.password=${DB_PASSWORD:futslot}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Auth. Override both secrets in every deployed environment (32+ random bytes each).
futslot.security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
futslot.security.jwt.access-token-ttl=15m
futslot.security.jwt.refresh-token-ttl=30d
futslot.security.otp.secret=${OTP_SECRET:dev-only-otp-secret-change-me-0123456789}
futslot.security.otp.ttl=5m
futslot.security.otp.max-attempts=5
futslot.security.otp.resend-cooldown=60s
futslot.security.otp.max-per-hour=5
