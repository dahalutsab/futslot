spring.application.name=futslot-api

# Database (defaults match docker-compose.yml at the repo root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/futslot}
spring.datasource.username=${DB_USERNAME:futslot}
spring.datasource.password=${DB_PASSWORD:futslot}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
