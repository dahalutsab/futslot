spring.application.name=futslot-api

# Database (defaults match docker-compose.yml at the repo root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/futslot}
spring.datasource.username=${DB_USERNAME:futslot}
spring.datasource.password=${DB_PASSWORD:futslot}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Loads lazy collections (courts, pricing rules) for many entities in one query instead of N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Auth. Override both secrets in every deployed environment (32+ random bytes each).
futslot.security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
futslot.security.jwt.access-token-ttl=15m
futslot.security.jwt.refresh-token-ttl=30d
futslot.security.otp.secret=${OTP_SECRET:dev-only-otp-secret-change-me-0123456789}
futslot.security.otp.ttl=5m
futslot.security.otp.max-attempts=5
futslot.security.otp.resend-cooldown=60s
futslot.security.otp.max-per-hour=5
futslot.security.password.max-failures=5
futslot.security.password.lockout=15m
# OAuth client ids from the Google Cloud project: the web one (also used by Android), and the iOS one. No web
# client id turns Google sign-in off.
futslot.security.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
futslot.security.google.other-client-ids=${GOOGLE_IOS_CLIENT_ID:}

# FutSlot's own billing (venues paying FutSlot). Until a gateway is connected, venues pay the account below
# and an admin verifies the payment. Plan limits are off at launch: every venue gets everything.
futslot.subscriptions.enforce-limits=false
futslot.subscriptions.payment-instructions=${FUTSLOT_PAYMENT_INSTRUCTIONS:Contact FutSlot for payment details}
futslot.subscriptions.renewal-notice-days=7
futslot.subscriptions.grace-days=7
# Featured listings: rupees per day, and how many venues can hold the placement at once (per city for CITY_TOP)
futslot.subscriptions.featured.HOME_CAROUSEL.price-per-day=300
futslot.subscriptions.featured.HOME_CAROUSEL.max-live=5
futslot.subscriptions.featured.SEARCH_TOP.price-per-day=200
futslot.subscriptions.featured.SEARCH_TOP.max-live=3
futslot.subscriptions.featured.CITY_TOP.price-per-day=100
futslot.subscriptions.featured.CITY_TOP.max-live=3

# Uploaded images (venue photos). Mount a volume here in production.
futslot.media.dir=${FUTSLOT_MEDIA_DIR:media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Venue websites: {subdomain}.<base-domain>; in development any *.localhost resolves to this machine
futslot.sites.base-domain=${SITES_BASE_DOMAIN:localhost}
futslot.sites.url-template=${SITES_URL_TEMPLATE:http://{subdomain}.localhost:8080}
futslot.sites.dns-target=${SITES_DNS_TARGET:sites.futslot.com}
futslot.sites.session-secret=${SITES_SESSION_SECRET:dev-only-site-session-secret-change-me-0123456789}
