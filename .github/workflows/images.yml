# Builds the API and web images for the server (deploy/compose.yml) and publishes them to GitHub's container
# registry, tagged latest and with the commit. The server only pulls them: it's too small to build.
name: Images

on:
  push:
    branches: [main]
    paths: [backend/**, player/**, dashboard/**, admin/**, deploy/Caddyfile, deploy/web.Dockerfile, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: futslot-api
            context: backend
            file: backend/Dockerfile
          - name: futslot-web
            context: .
            file: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
