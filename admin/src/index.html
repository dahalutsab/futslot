<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FutSlot admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="FutSlot admin: venues, payments, deposits and moderation.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint, so dark mode doesn't flash white
    try {
      const theme = localStorage.getItem('futslot.theme') ?? 'system';
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
