openapi: 3.1.0
info:
  title: FutSlot API
  description: "Contract shared by the backend, owner dashboard and mobile app."
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/v1/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
  /api/v1/auth/otp/verify:
    post:
      tags:
      - auth-controller
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
  /api/v1/auth/otp/request:
    post:
      tags:
      - auth-controller
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OtpSentResponse"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
      security: []
  /api/v1/me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    patch:
      tags:
      - me-controller
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
components:
  schemas:
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        preferredLanguage:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - PLAYER
            - OWNER
            - STAFF
            - ADMIN
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
          pattern: "\\d{6}"
        fullName:
          type: string
          maxLength: 100
          minLength: 2
      required:
      - code
      - phone
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
      required:
      - phone
    OtpSentResponse:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
          minLength: 2
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        preferredLanguage:
          type: string
          pattern: en|ne
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
